name: Quality

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache-dependency-path: agentic-iam-ui/package-lock.json
      - name: Install frontend
        run: npm install --prefix agentic-iam-ui
      - name: Build frontend
        run: npm run build --prefix agentic-iam-ui
      - name: Install backend
        run: npm install --prefix agentic-iam-backend
      - name: Build backend
        run: npm run build --prefix agentic-iam-backend
